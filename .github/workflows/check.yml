name: checks
on: [push, pull_request]
jobs:
  research-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build -c Release
      - run: dotnet run --no-build -c Release -- --self-test
      - run: dotnet run --no-build -c Release -- --run --runs 10 --output results.local
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-smoke-results
          path: results.local/
